<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090a0c" />
  <meta name="description" content="Mateo Saldivar — AI engineer portfolio." />
  <link rel="canonical" href="https://pentaenix.github.io/prototypes/" />
  <meta property="og:url" content="https://pentaenix.github.io/prototypes/" />
  <title>Mateo Saldivar — AI Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Bungee&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell" id="shell" data-mode="home">
    <div class="background" aria-hidden="true">
      <div class="background__plane"></div>
      <div class="background__grain"></div>
      
      <div class="background__dots"></div>
      <div class="background__lines"></div>
    </div>

    <header class="topbar">
      <a class="brand" href="#" aria-label="Mateo Saldivar home">
        <span class="brand__name">MATEO SALDIVAR</span>
        <span class="brand__role">AI ENGINEER</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <span class="nav__item is-active">WORK</span>
        <span class="nav__item">PROFILE</span>
        <span class="nav__item">CONTACT</span>
      </nav>
    </header>

    <section class="hero">
      <div class="hero__copy">
        <p class="eyebrow">SELECTED WORK</p>
        <h1 class="hero-title" aria-label="Complex systems made tangible.">
          <span class="hero-title__serif">COMPLEX</span>
          <span class="hero-title__block">SYSTEMS</span>
          <span class="hero-title__made">MADE</span>
          <span class="hero-title__accent-wrap"><span class="hero-title__accent-shadow" aria-hidden="true"></span><span class="hero-title__accent">TANGIBLE.</span></span>
        </h1>
        <p class="hero__lede">AI engineer building fast-turnaround prototypes, complex systems, and product experiences with strong technical depth and design sense.</p>
      </div>

      <section class="workbench" id="work-map" aria-label="Portfolio metro map">
        <div class="map-stage" id="map-stage">
          <svg class="metro-map__svg" viewBox="0 0 1000 760" aria-hidden="true">
            <g id="metro-base"></g>
            <g id="metro-selection"></g>
            <g id="metro-train-layer"></g>
            <g id="metro-masks"></g>
            <g id="metro-rings"></g>
            <g id="metro-labels"></g>
          </svg>
          <div class="metro-map__hotspots" id="metro-hotspots"></div>
          <div class="metro-tooltip" id="metro-tooltip" aria-hidden="true">
            <span class="metro-tooltip__title" id="tooltip-title"></span>
            <span class="metro-tooltip__subtitle" id="tooltip-subtitle"></span>
          </div>

          <aside class="preview-panel" id="preview-panel" aria-hidden="true">
            <div class="preview-panel__paper preview-panel__paper--back" aria-hidden="true"></div>
            <div class="preview-panel__paper preview-panel__paper--front" aria-hidden="true"></div>
            <button class="preview-panel__close" id="preview-close" type="button" aria-label="Close preview">×</button>
            <span class="preview-panel__kicker" id="preview-kicker"></span>
            <h2 class="preview-panel__title" id="preview-title"></h2>
            <div class="preview-panel__image" id="preview-image"></div>
            <p class="preview-panel__description" id="preview-description"></p>
            <button class="preview-panel__enter" id="preview-enter" type="button">
              <span>ENTER SECTION</span><span aria-hidden="true">↗</span>
            </button>
          </aside>
        </div>
      </section>
    </section>
  </main>

  <section class="detail-view" id="detail-view" aria-hidden="true">
    <button class="detail-view__return" id="return-detail" type="button"><span aria-hidden="true">↙</span><span>RETURN TO MAP</span></button>
    <div class="detail-view__body">
      <p class="eyebrow">SECTION</p>
      <h2 id="detail-title"></h2>
      <p class="detail-view__statement" id="detail-statement"></p>
      <div class="detail-view__gallery" id="detail-gallery"></div>
    </div>
  </section>

  <div class="strike" id="strike" aria-hidden="true">
    <div class="strike__fill"></div>
    <div class="strike__block strike__block--top"></div>
    <div class="strike__block strike__block--bottom"></div>
    <div class="strike__block strike__block--top-accent"></div>
    <div class="strike__block strike__block--bottom-accent"></div>
    <div class="strike__title" id="strike-title"></div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
